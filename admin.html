<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard — SmartCampus</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<header class="navbar">
  <h2>Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <h3>Create Student</h3>
  <input id="sName" placeholder="Student Name">
  <input id="sReg" placeholder="Register Number">
  <input id="sDept" placeholder="Department">
  <button onclick="createStudent()">Add Student</button>

  <hr>

  <h3>Create HOD / Faculty</h3>
  <input id="hName" placeholder="HOD Name">
  <input id="hDept" placeholder="Department">
  <input id="hPhone" placeholder="Phone Number">
  <button onclick="createHOD()">Add HOD</button>

  <hr>

  <h3>Students List</h3>
  <div id="studentList"></div>

  <hr>

  <h3>HOD List</h3>
  <div id="hodList"></div>

</div>

<script src="admin.js"></script>
</body>
</html>
